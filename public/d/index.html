<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Plashboard</title>
  <link rel="icon" href="/assets/favicon.svg" />
  <link rel="stylesheet" href="/assets/render.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #root { position: fixed; inset: 0; }
    .pb-msg {
      position: fixed; inset: 0; display: grid; place-items: center; text-align: center;
      font: 500 15px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; color: #9aa3b2; background: #0b0d12; padding: 24px;
    }
    .pb-msg b { color: #fff; font-size: 18px; display: block; margin-bottom: 6px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/assets/viewer.js"></script>
</body>
</html>
